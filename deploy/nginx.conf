# /etc/nginx/sites-available/christianastrology
# After this works on port 80, run:  sudo certbot --nginx -d christianastrology.org -d www.christianastrology.org
# Certbot adds the 443/SSL server block and the http→https redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name christianastrology.org www.christianastrology.org;

    client_max_body_size 2m;

    # Static assets straight from disk (the app also serves them; this is just faster).
    location ~ ^/(css|js|img)/ {
        root /var/www/christianastrology/public;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @app;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
